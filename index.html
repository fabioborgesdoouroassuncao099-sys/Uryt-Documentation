<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uryt — Documentação</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: #0d0d12;
    color: #e8e8e8;
    line-height: 1.7;
    padding: 20px;
  }
  header {
    text-align: center;
    padding: 40px 20px;
    border-bottom: 1px solid #2a2a3a;
  }
  header h1 {
    font-size: 3.5em;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #00d4ff, #7b2fff, #00d4ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
    text-shadow: 0 0 40px rgba(0,212,255,0.5);
  }
  header p { color: #888; font-style: italic; font-size: 1.1em; }
  .tabs {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 30px 0;
    flex-wrap: wrap;
  }
  .tab {
    background: #1a1a24;
    color: #aaa;
    border: 1px solid #2a2a3a;
    padding: 12px 24px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1em;
    font-family: inherit;
    transition: all 0.2s;
  }
  .tab:hover { background: #22222e; color: #ddd; }
  .tab.active {
    background: linear-gradient(135deg, #00d4ff, #7b2fff);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 0 20px rgba(0,212,255,0.4);
  }
  .content {
    max-width: 850px;
    margin: 0 auto;
    background: #14141c;
    border: 1px solid #2a2a3a;
    border-radius: 12px;
    padding: 40px;
  }
  .doc { display: none; }
  .doc.active { display: block; animation: fade 0.3s; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .doc p { margin-bottom: 18px; font-size: 1.05em; color: #d0d0d8; }
  .doc code {
    background: #0a0a10;
    color: #00d4ff;
    padding: 2px 8px;
    border-radius: 4px;
    font-family: 'Courier New', monospace;
    font-size: 0.95em;
    border: 1px solid #2a2a3a;
  }
  footer {
    text-align: center;
    margin-top: 40px;
    color: #666;
    font-size: 0.9em;
  }
</style>
</head>
<body>

  <header>
    <h1>URYT</h1>
    <p>Documentação oficial do sistema</p>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="showDoc('doc1')">Introdução</button>
    <button class="tab" onclick="showDoc('doc2')">Instalação</button>
  </div>

  <div class="content">
    <div id="doc1" class="doc active">
      <h2>Introdução</h2>
      <p>Bem-vindo à documentação do <code>Uryt</code>. Utilize as abas acima para navegar.</p>
    </div>
    <div id="doc2" class="doc">
      <h2>Instalação</h2>
      <p>Para instalar, execute o comando no terminal.</p>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Uryt. Todos os direitos reservados.</p>
  </footer>

  <script>
    function showDoc(id) {
      document.querySelectorAll('.doc').forEach(d => d.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      event.currentTarget.classList.add('active');
    }
  </script>

</body>
</html>
